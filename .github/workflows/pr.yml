name: Fixture PR
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  fixture-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open synthetic integration PR as fixture bot
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          [[ "$BRANCH" =~ ^synarch/verified-[a-f0-9]{20}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls" -f head="$BRANCH" -f base=main -f title="Synthetic protected integration acceptance" -f body="Fixture-only validation. No Synarch source or secrets."
